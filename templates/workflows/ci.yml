name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 22

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v3
        with:
          version: 9.12.0
          run_install: false
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec nx run-many --target=lint --all --parallel || pnpm run lint --if-present || echo "No lint target defined"
      - name: Test
        run: pnpm exec nx run-many --target=test --all --configuration=ci --parallel || pnpm test --if-present || echo "No test target defined"
      - name: Build
        run: pnpm exec nx run-many --target=build --all --configuration=production || pnpm run build --if-present
